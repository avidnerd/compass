      THESIS: Compass is a one-bit system, not a study app with a mascot beside it. It refuses
      the grid of equal rounded cards: every surface is a window on a dithered desktop, and the
      companion is a citizen of that system rather than a sticker on top of one.
      OWN-WORLD: Black and white only. Ordered dithers stand in for every gray; classification
      is carried by pattern, never colour. One-pixel chrome, dithered drop shadows, inverted
      title bars, travelling marching-ants selection, authored 12-grid pixel icons, Silkscreen
      chrome set over a Geneva body. Motion is stepped, never eased.
      STORY: A student sees work they actually did arrive as stamped entries in a log they
      cannot fake, and a companion whose growth is a readout of that log.
      FIRST VIEWPORT: Menu bar with a working pull-down across the top; dithered desktop
      beneath. Two columns: companion window left over its counted-cell stat channels; Focus
      window leading the right column with the primary control and the privacy disclosure,
      then the quest window and the evidence log. Desktop status bar with counts along the
      foot.
      FORM: One-Bit Desktop, dealt challenger, verdict competitive, chosen over the assigned
      Instrument Panel by the user; seed acf7f790.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
