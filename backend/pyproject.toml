[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compass-study"
version = "0.1.0"
description = "Compass checks that you actually did the work: local-first study tracking that verifies progress from your own Google Workspace and GitHub accounts. Read-only, free-model-only, no hosted server."
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "avidnerd" }, { name = "justanotherinternetguy" }]
keywords = ["study", "productivity", "local-first", "canvas", "focus"]
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]

# Pinned to match what the test suite ran against.
dependencies = [
  "aiosqlite==0.22.1",
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "python-dotenv==1.2.3",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
# Starts the local server and opens the user's real browser. Deliberately not a
# webview: getDisplayMedia, which the focus monitor needs, does not work in one.
compass = "app.cli:main"

[project.urls]
Homepage = "https://github.com/avidnerd/compass"
Source = "https://github.com/avidnerd/compass"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# The built SPA and the SQL migrations must travel with the package: an
# installed copy has no repo to read either from.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "app/migrations"

[tool.hatch.build]
artifacts = ["app/web/**"]
